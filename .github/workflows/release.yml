name: release
on:
  push:
    tags: ["v*"]
  # Manual run = dry run: builds and verifies the signed APK, uploads it as a
  # workflow artifact, publishes nothing.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build server binaries
        working-directory: server
        run: |
          mkdir -p ../dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            os=${target%/*}; arch=${target#*/}; ext=""
            [ "$os" = windows ] && ext=.exe
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" \
              -o ../dist/smsmcp_${os}_${arch}${ext} ./cmd/smsmcp
          done

      # Every release is signed with the same key (see docs/RELEASING.md), so
      # installed apps update in place instead of needing a reinstall.
      - name: Build signed gateway APK
        working-directory: client
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          SMSMCP_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SMSMCP_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          SMSMCP_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          EXPECTED_CERT_SHA256: ${{ vars.ANDROID_CERT_SHA256 }}
        run: |
          set -eu
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$EXPECTED_CERT_SHA256" ]; then
            echo "::error::Signing secrets or ANDROID_CERT_SHA256 variable missing. See docs/RELEASING.md."
            exit 1
          fi

          # v1.2.3 -> versionName 1.2.3, versionCode 10203 (minor and patch must be < 100).
          # Dry runs (not a tag) build as 0.0.0.
          if [ "$GITHUB_REF_TYPE" = tag ]; then ver="${GITHUB_REF_NAME#v}"; else ver=0.0.0; fi
          case "$ver" in
            *[!0-9.]*|*.*.*.*) echo "::error::Tag must look like v1.2.3, got $GITHUB_REF_NAME"; exit 1 ;;
          esac
          major=${ver%%.*}; rest=${ver#*.}; minor=${rest%%.*}; patch=${rest#*.}
          if [ "$rest" = "$ver" ] || [ "$patch" = "$rest" ] || [ -z "$major" ] || [ -z "$minor" ] || [ -z "$patch" ] \
             || [ "$minor" -ge 100 ] || [ "$patch" -ge 100 ]; then
            echo "::error::Tag must look like v1.2.3 with minor and patch below 100"; exit 1
          fi
          code=$((major * 10000 + minor * 100 + patch))
          [ "$code" -ge 1 ] || code=1

          export SMSMCP_KEYSTORE_FILE="$RUNNER_TEMP/release.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$SMSMCP_KEYSTORE_FILE"
          ./gradlew --no-daemon assembleRelease -PversionName="$ver" -PversionCode="$code"
          rm -f "$SMSMCP_KEYSTORE_FILE"

          apk=app/build/outputs/apk/release/app-release.apk
          apksigner=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          [ -n "$apksigner" ] || { echo "::error::apksigner not found under $ANDROID_HOME/build-tools"; exit 1; }
          echo "Using $apksigner"
          certs=$("$apksigner" verify --print-certs "$apk" 2>&1) || { echo "$certs"; echo "::error::APK signature does not verify"; exit 1; }
          echo "$certs" | grep -v '^WARNING'
          # apksigner <=36 prints "Signer #1 certificate ...", 37+ prints "V2 Signer: certificate ...".
          actual=$(echo "$certs" | sed -n -E 's/^(Signer #1|V[0-9]+ Signer):? certificate SHA-256 digest: //p' | head -1)
          expected=$(printf '%s' "$EXPECTED_CERT_SHA256" | tr -d ':' | tr '[:upper:]' '[:lower:]')
          if [ "$actual" != "$expected" ]; then
            echo "::error::APK signed with $actual but releases must use $expected. Refusing to publish."
            exit 1
          fi
          echo "Signed $ver ($code) with certificate $actual"
          cp "$apk" ../dist/smsmcp-gateway.apk

      - name: Upload dry-run artifacts
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: dry-run
          path: dist/
          retention-days: 3

      - name: Publish release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes
